name: clinic-vet-api

services:
  # The complete local application. DATABASE_URL and REDIS_URL deliberately
  # target the services below instead of any cloud values in .env.
  api:
    container_name: clinic_vet_api
    build:
      context: .
      dockerfile: Dockerfile
    image: clinic-vet-api:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-vet_database}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-vetredis}@redis:6379/${REDIS_DB:-0}
      SKIP_MIGRATIONS: "false"
      SKIP_DB_WAIT: "false"
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network
      - data_network

  postgres:
    image: postgres:16-alpine
    container_name: clinic_vet_postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-vet_database}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-vet_database}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - data_network

  redis:
    image: redis:7-alpine
    container_name: clinic_vet_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-vetredis}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-vetredis} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - data_network

networks:
  # Lets the API communicate with external providers (SMTP, Twilio, etc.).
  app_network:
    driver: bridge
  # Datastores have no host ports and are reachable only by the API.
  data_network:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
