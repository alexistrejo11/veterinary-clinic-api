      employee_id:
        description: |-
          ID of the associated employee (for staff users)
          Example: 456
        example: 456
        type: integer
      id:
        description: |-
          Unique identifier for the user
          Example: 123
        example: 123
        type: integer
      last_login_at:
        description: |-
          Last login timestamp
