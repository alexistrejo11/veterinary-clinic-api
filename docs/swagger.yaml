        example: customer
        type: string
      status:
        description: |-
          Status of the user account (active, inactive, banned, pending)
          Example: active
        example: active
        type: string
      two_factor_enabled:
        description: |-
          Whether two-factor authentication is enabled
          Example: false
        example: false
        type: boolean
      updated_at:
        description: |-
          Last update timestamp
