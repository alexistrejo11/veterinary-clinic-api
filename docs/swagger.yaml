info:
  contact:
    email: support@swagger.io
    name: Equipo de Soporte API
    url: http://www.swagger.io/support
  description: 'API REST para la gestión de la clínica veterinaria: autenticación,
    usuarios, clientes, empleados, mascotas, citas, pagos y notificaciones.'
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: API Clínica Veterinaria
  version: "2.0"
paths:
  /addresses:
    get:
      description: Lists addresses. Requires admin or receptionist role.
      parameters:
      - description: Page number
        in: query
        name: page_number
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/clinic-vet-api_internal_infrastructure_http_handlers_dtos.AddressResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Search addresses
      tags:
      - addresses
  /addresses/users/{user_id}:
    get:
      description: Lists addresses for a user. Requires admin or receptionist role.
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/clinic-vet-api_internal_infrastructure_http_handlers_dtos.AddressResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List user addresses
      tags:
      - addresses
    post:
      description: Creates an address for a user. Requires admin or receptionist role.
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: Address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clinic-vet-api_internal_infrastructure_http_handlers_dtos.AddressCreateRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
      security:
      - BearerAuth: []
      summary: Create user address
      tags:
      - addresses
  /addresses/users/{user_id}/{id}:
    delete:
      description: Deletes an address for a user. Requires admin or receptionist role.
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: Address ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete user address
      tags:
      - addresses
    get:
      description: Returns an address for a user. Requires admin or receptionist role.
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: Address ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/clinic-vet-api_internal_infrastructure_http_handlers_dtos.AddressResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get user address
      tags:
      - addresses
    put:
      description: Updates an address for a user. Requires admin or receptionist role.
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: Address ID
        in: path
        name: id
        required: true
        type: integer
      - description: Address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clinic-vet-api_internal_infrastructure_http_handlers_dtos.AddressUpdateRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
      security:
      - BearerAuth: []
      summary: Update user address
      tags:
      - addresses
  /appointments:
    get:
      consumes:
      - application/json
      description: Paginated search of all appointments with filters. Requires admin
        or receptionist role.
      parameters:
      - description: Search criteria and pagination
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clinic-vet-api_internal_infrastructure_http_handlers_dtos.AppointmentSearchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Paginated appointments
          schema:
            allOf:
            - $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/clinic-vet-api_internal_infrastructure_http_handlers_dtos.AppointmentResponse'
                  type: array
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
      security:
      - BearerAuth: []
      summary: Search appointments (receptionist/admin)
      tags:
      - appointments
    post:
      consumes:
      - application/json
      description: Creates a new appointment, optionally assigned to a veterinarian
        via query param. Requires admin or receptionist role.
      parameters:
      - description: Employee ID to assign
        in: query
        name: employee_id
        type: integer
      - description: Appointment data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clinic-vet-api_internal_infrastructure_http_handlers_dtos.AppointmentCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Appointment created (data contains new appointment ID)
          schema:
            $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
      security:
      - BearerAuth: []
      summary: Create appointment (receptionist/admin)
      tags:
      - appointments
  /appointments/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes an appointment. Soft-delete by default; pass hard=true
        for permanent deletion. Requires admin or receptionist role.
      parameters:
      - description: Appointment ID
        in: path
        name: id
        required: true
        type: integer
      - default: false
        description: Hard delete (permanent)
        in: query
        name: hard
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Appointment deleted
          schema:
            $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
        "404":
          description: Appointment not found
          schema:
            $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/clinic-vet-api_internal_shared_http.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete appointment (receptionist/admin)
