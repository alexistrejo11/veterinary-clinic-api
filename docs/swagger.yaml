basePath: /api/v2
definitions:
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.ActivateAccountRequest:
    description: User ID and activation code (e.g. from email link). Supports query
      params or JSON body.
    properties:
      code:
        maxLength: 64
        type: string
      user_id:
        maxLength: 20
        type: string
    required:
    - code
    - user_id
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.AddAttachmentRequest:
    description: Session ID, file_type, file_url, optional description, uploaded_by.
    properties:
      description:
        type: string
      file_type:
        type: string
      file_url:
        type: string
      session_id:
        type: integer
      uploaded_by:
        type: integer
    required:
    - file_type
    - file_url
    - session_id
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.AddPrescriptionRequest:
    description: Session ID, medication ID, dosage, frequency, start_date, optional
      duration_days, route, instructions.
    properties:
      dosage:
        type: string
      duration_days:
        type: integer
      frequency:
        type: string
      instructions:
        type: string
      medication_id:
        type: integer
      route:
        type: string
      session_id:
        type: integer
      start_date:
        description: RFC3339
        type: string
    required:
    - dosage
    - frequency
    - medication_id
    - session_id
    - start_date
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.AddSessionServiceRequest:
    description: Session ID, service catalog ID, quantity, optional price_applied,
      notes.
    properties:
      notes:
        type: string
      price_applied:
        type: number
      quantity:
        type: number
      service_catalog_id:
        type: integer
      session_id:
        type: integer
    required:
    - quantity
    - service_catalog_id
    - session_id
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.AddSurgeryRequest:
    description: Session ID, procedure name, outcome (required), optional anesthesia,
      pre/intra/post-op notes, duration, surgeon_id.
    properties:
      anesthesia_agent:
        type: string
      anesthesia_type:
        type: string
      duration_minutes:
        type: integer
      intra_op_notes:
        type: string
      outcome:
        type: string
      post_op_notes:
        type: string
      pre_op_notes:
        type: string
      procedure_name:
        type: string
      session_id:
        type: integer
      surgeon_id:
        type: integer
    required:
    - outcome
    - procedure_name
    - session_id
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.AddVaccinationRequest:
    description: Session ID, vaccine catalog ID, dose number, optional batch, expiration,
      site, next dose date, reaction notes, administered_by.
    properties:
      administered_by:
        type: integer
      batch_number:
        type: string
      dose_number:
        minimum: 1
        type: integer
      expiration_date:
        type: string
      next_dose_date:
        type: string
      reaction_notes:
        type: string
      session_id:
        type: integer
      site_of_injection:
        type: string
      vaccine_catalog_id:
        type: integer
    required:
    - dose_number
    - session_id
    - vaccine_catalog_id
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.AddressCreateRequest:
    description: Street, city, state, zip, country, building type/numbers, and whether
      it is the default address.
    properties:
      building_inner_number:
        type: string
      building_outer_number:
        type: string
      building_type:
        type: string
      city:
        type: string
      country:
        type: string
      is_default:
        type: boolean
      state:
        type: string
      street:
        type: string
      zip_code:
        type: string
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.AddressResponse:
    description: 'Address entity: id, street, city, state, zip, country, building
      details, is_default.'
    properties:
      building_inner_number:
        type: string
      building_outer_number:
        type: string
      building_type:
        type: string
      city:
        type: string
      country:
        type: string
      id:
        type: integer
      is_default:
        type: boolean
      state:
        type: string
      street:
        type: string
      zip_code:
        type: string
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.AddressUpdateRequest:
    description: Optional fields to update; only provided fields are changed.
    properties:
      building_inner_number:
        type: string
      building_outer_number:
        type: string
      building_type:
        type: string
      city:
        type: string
      country:
        type: string
      id:
        type: integer
      is_default:
        type: boolean
      state:
        type: string
      street:
        type: string
      zip_code:
        type: string
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.AppointmentCreateRequest:
    description: Request body for creating a new appointment
    properties:
      customer_id:
        description: |-
          ID of the customer making the appointment
          Required: true
        example: 123
        type: integer
      notes:
        description: Additional notes for the appointment (optional)
        example: Patient has allergy to penicillin
        type: string
      pet_id:
        description: |-
          ID of the pet for the appointment
          Required: true
        example: 456
        type: integer
      reason:
        description: |-
          Reason for the appointment
          Required: true
        example: Annual checkup
        type: string
      scheduled_date:
        description: |-
          Date and time of the appointment
          Required: true
          Format: RFC3339
        example: "2024-03-15T10:30:00Z"
        type: string
      service:
        description: |-
          Service requested
          Required: true
        example: Vaccination
        type: string
      status:
        description: |-
          Status of the appointment
          Required: false (defaults to "scheduled")
        example: scheduled
        type: string
    required:
    - customer_id
    - pet_id
    - reason
    - scheduled_date
    - service
    - status
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.AppointmentRequestByCustomerRequest:
    description: Pet ID, scheduled date/time, reason, service, optional notes. Customer
      ID is taken from auth.
    properties:
      notes:
        type: string
      pet_id:
        type: integer
      reason:
        type: string
      scheduled_date:
        type: string
      service:
        type: string
    required:
    - pet_id
    - reason
    - scheduled_date
    - service
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.AppointmentResponse:
    description: 'Appointment entity: id, pet_id, customer_id, employee_id, service,
      datetime, status, reason, notes, timestamps.'
    properties:
      created_at:
        type: string
      customer_id:
        type: integer
      date_time:
        type: string
      id:
        type: integer
      notes:
        type: string
      pet_id:
        type: integer
      reason:
        type: string
      scheduled_date:
        type: string
      service:
        type: string
      status:
        type: string
      updated_at:
        type: string
      vet_id:
        type: integer
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.AppointmentSearchRequest:
    description: Optional customer_id, vet_id, pet_id, service, status, reason, start_date,
      end_date, has_notes, plus pagination.
    properties:
      customer_id:
        minimum: 1
        type: integer
      end_date:
        type: string
      has_notes:
        type: boolean
      order_by:
        maxLength: 50
        type: string
      page:
        minimum: 1
        type: integer
      page_size:
        maximum: 100
        minimum: 1
        type: integer
      pet_id:
        minimum: 1
        type: integer
      reason:
        type: string
      service:
        type: string
      sort_direction:
        allOf:
        - $ref: '#/definitions/clinic-vet-api_internal_shared_page.SortDirection'
        enum:
        - ASC
        - DESC
      start_date:
        type: string
      status:
        type: string
      vet_id:
        minimum: 1
        type: integer
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.AppointmentUpdateGeneralInfoRequest:
    description: Optional reason, notes, and service. Only provided fields are updated.
    properties:
      notes:
        description: 'Optional: Additional notes or observations about the appointment'
        example: Patient requires special handling
        maxLength: 1000
        type: string
      reason:
        description: 'Optional: Reason for updating the appointment'
        example: Updated reason for appointment
        maxLength: 500
        type: string
      service:
        description: 'Optional: Service type for the appointment (e.g., "checkup",
          "vaccination", "surgery")'
        example: Annual checkup
        maxLength: 100
        type: string
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.CreateMedicationCatalogRequest:
    description: Name, optional active_ingredient, presentation, unit, requires_prescription,
      species_warnings.
    properties:
      active_ingredient:
        type: string
      name:
        type: string
      presentation:
        type: string
      requires_prescription:
        type: boolean
      species_warnings:
        type: string
      unit:
        type: string
    required:
    - name
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.CreateServiceCatalogRequest:
    description: Name, category, optional description, base_price, duration_minutes,
      requires_fasting.
    properties:
      base_price:
        type: number
      category:
        type: string
      description:
        type: string
      duration_minutes:
        type: integer
      name:
        type: string
      requires_fasting:
        type: boolean
    required:
    - category
    - name
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.CreateSessionRequest:
    description: Pet, customer, employee, optional appointment, clinic service, visit
      type/date, optional vitals (weight, temp, heart/resp rate), symptoms, diagnosis,
      treatment, notes, medications, follow-up date.
    properties:
      appointment_id:
        type: integer
      clinic_service:
        type: string
      condition:
        type: string
      customer_id:
        type: integer
      diagnosis:
        type: string
      employee_id:
        type: integer
      follow_up_date:
        description: RFC3339
        type: string
      heart_rate:
        type: integer
      is_emergency:
        type: boolean
      medications:
        type: string
      notes:
        type: string
      pet_id:
        type: integer
      respiratory_rate:
        type: integer
      symptoms:
        type: string
      temperature_c:
        type: number
      treatment:
        type: string
      visit_date:
        description: RFC3339
        type: string
      visit_type:
        type: string
      weight_kg:
        type: number
    required:
    - clinic_service
    - customer_id
    - employee_id
    - pet_id
    - visit_date
    - visit_type
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.CreateUserRequest:
    description: Request body for creating a new user account
    properties:
      email:
        description: |-
          Email address of the user
          Required: true
          Example: user@example.com``
        example: user@example.com
        type: string
      password:
        description: |-
          Plain text password (will be hashed)
          Required: true
          Minimum length: 8 characters
        example: SecurePass123!
        minLength: 8
        type: string
      phone_number:
        description: |-
          Phone number of the user
          Required: false
          Example: +1234567890
        example: "+1234567890"
        minLength: 10
        type: string
      profile:
        allOf:
        - $ref: '#/definitions/clinic-vet-api_internal_infrastructure_http_handlers_dtos.ProfileInfo'
        description: User profile information
      role:
        description: |-
          Role of the user (admin, veterinarian, customer, receptionist)
          Required: true
          Example: customer
        enum:
        - admin
        - veterinarian
        - customer
        - receptionist
        example: customer
        type: string
      status:
        description: |-
          Initial status of the user account
          Required: false (defaults to "pending")
          Example: active
        enum:
        - active
        - inactive
        - pending
        example: active
        type: string
    required:
    - email
    - password
    - role
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.CreateVaccineCatalogRequest:
    description: Name, optional manufacturer, species, disease_target, total_doses,
      schedule_days, notes.
    properties:
      disease_target:
        type: string
      manufacturer:
        type: string
      name:
        type: string
      notes:
        type: string
      schedule_days:
        items:
          type: integer
        type: array
      species:
        type: string
      total_doses:
        minimum: 1
        type: integer
    required:
    - name
    - total_doses
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.CustomerCreateRequest:
    description: First name, last name, email, gender, date of birth, optional photo
      URL, is_active, and optional user_id to link account.
    properties:
      date_of_birth:
        type: string
      email:
        type: string
      first_name:
        type: string
      gender:
        enum:
        - male
        - female
        - not_specified
        - other
        type: string
      is_active:
        type: boolean
      last_name:
        type: string
      photo_url:
        type: string
      user_id:
        type: integer
    required:
    - date_of_birth
    - email
    - first_name
    - gender
    - last_name
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.CustomerResponse:
    description: 'Customer entity: id, name, gender, date of birth, photo, user_id,
      is_active, timestamps.'
    properties:
      created_at:
        type: string
      date_of_birth:
        type: string
      first_name:
        type: string
      gender:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      last_name:
        type: string
      photo_url:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.CustomerSearchRequest:
    description: Pagination plus optional search text and is_active filter.
    properties:
      is_active:
        description: Optional active filter.
        type: boolean
      order_by:
        maxLength: 50
        type: string
      page:
        minimum: 1
        type: integer
      page_size:
        maximum: 100
        minimum: 1
        type: integer
      search:
        description: Optional text search over first and last name.
        type: string
      sort_direction:
        allOf:
        - $ref: '#/definitions/clinic-vet-api_internal_shared_page.SortDirection'
        enum:
        - ASC
        - DESC
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.CustomerUpdateRequest:
    description: ID (required) plus optional fields to update. ID can also be taken
      from URL path.
    properties:
      date_of_birth:
        type: string
      first_name:
        type: string
      gender:
        enum:
        - male
        - female
        - not_specified
        - other
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      last_name:
        type: string
      photo_url:
        type: string
      user_id:
        type: integer
    required:
    - id
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.EmployeeCreateRequest:
    description: Name, gender, date of birth, photo, license number, years experience,
      specialty, schedule, optional is_active.
    properties:
      date_of_birth:
        type: string
      first_name:
        type: string
      gender:
        enum:
        - male
        - female
        - not_specified
        - other
        type: string
      is_active:
        type: boolean
      last_name:
        type: string
      license_number:
        type: string
      photo:
        type: string
      schedule:
        $ref: '#/definitions/clinic-vet-api_internal_infrastructure_http_handlers_dtos.EmployeeScheduleRequest'
      specialty:
        type: string
      years_experience:
        maximum: 60
        minimum: 0
        type: integer
    required:
    - date_of_birth
    - first_name
    - gender
    - last_name
    - license_number
    - schedule
    - specialty
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.EmployeeResponse:
    description: 'Employee entity: id, name, gender, date of birth, photo, license,
      specialty, years experience, is_active, user_id, timestamps.'
    properties:
      created_at:
        type: string
      date_of_birth:
        type: string
      first_name:
        type: string
      gender:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      last_name:
        type: string
      license_number:
        type: string
      photo:
        type: string
      specialty:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
      years_experience:
        type: integer
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.EmployeeScheduleRequest:
    description: Day of week, entry/departure time (0-23), optional break window.
    properties:
      day:
        description: e.g. "monday"
        type: string
      departure_time:
        maximum: 23
        minimum: 0
        type: integer
      end_break:
        maximum: 23
        minimum: 0
        type: integer
      entry_time:
        description: 0-23
        maximum: 23
        minimum: 0
        type: integer
      start_break:
        maximum: 23
        minimum: 0
        type: integer
    required:
    - day
    - departure_time
    - entry_time
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.EmployeeSearchRequest:
    description: Pagination plus optional specialty and is_active filter.
    properties:
      is_active:
        type: boolean
      order_by:
        maxLength: 50
        type: string
      page:
        minimum: 1
        type: integer
      page_size:
        maximum: 100
        minimum: 1
        type: integer
      sort_direction:
        allOf:
        - $ref: '#/definitions/clinic-vet-api_internal_shared_page.SortDirection'
        enum:
        - ASC
        - DESC
      specialty:
        type: string
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.EmployeeStatsResponse:
    description: Total employees, active count, and count per specialty.
    properties:
      active_employees:
        type: integer
      specialties:
        additionalProperties:
          format: int64
          type: integer
        type: object
      total_employees:
        type: integer
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.EmployeeUpdateRequest:
    description: ID (required) plus optional fields and optional schedule.
    properties:
      date_of_birth:
        type: string
      first_name:
        type: string
      gender:
        enum:
        - male
        - female
        - not_specified
        - other
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      last_name:
        type: string
      license_number:
        type: string
      photo:
        type: string
      schedule:
        $ref: '#/definitions/clinic-vet-api_internal_infrastructure_http_handlers_dtos.EmployeeScheduleRequest'
      specialty:
        type: string
      years_experience:
        maximum: 60
        minimum: 0
        type: integer
    required:
    - id
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.EnableTwoFactorRequest:
    description: '2FA method: totp.'
    properties:
      method:
        type: string
    required:
    - method
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.LoginRequest:
    description: Email, password, and optional two_factor_code when 2FA is enabled.
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 128
        type: string
    required:
    - email
    - password
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.LogoutRequest:
    description: Refresh token to revoke for the current session.
    properties:
      refresh_token:
        maxLength: 2000
        type: string
    required:
    - refresh_token
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.NotificationResponse:
    description: 'Notification entity: id, user_id, user_email, user_phone, title,
      subject, message, type, channel, created_at.'
    properties:
      attempts:
        type: integer
      channel:
        description: Delivery channel (email, sms)
        example: email
        type: string
      created_at:
        description: Creation timestamp
        example: "2024-01-01T00:00:00Z"
        type: string
      failure_message:
        type: string
      id:
        description: Unique identifier of the notification
        example: 665f1c2ab3d4e5f6a7b8c9d0
        type: string
      message:
        description: Notification message body
        example: Don't forget your appointment at 10:00.
        type: string
      provider_reference:
        type: string
      sent_at:
        type: string
      status:
        example: sent
        type: string
      subject:
        description: Notification subject
        example: Your appointment is tomorrow
        type: string
      title:
        description: Notification title
        example: Appointment reminder
        type: string
      type:
        description: Notification type
        example: appointment_reminder
        type: string
      user_email:
        description: Target email (for email channel)
        example: user@example.com
        type: string
      user_id:
        description: ID of the target user (if any)
        example: "123"
        type: string
      user_phone:
        description: Target phone (for sms channel)
        example: "+1234567890"
        type: string
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.PaymentCreateRequest:
    description: Creates an authorized internal ledger entry. Reference is the caller's
      idempotency key; this API never sends a payment to an external processor.
    properties:
      amount:
        type: number
      appointment_id:
        type: integer
      currency:
        type: string
      customer_id:
        description: Relations
        type: integer
      description:
        maxLength: 500
        type: string
      due_date:
        type: string
      invoice_id:
        type: string
      method:
        type: string
      reason:
        maxLength: 1000
        type: string
      reference:
        maxLength: 255
        type: string
    required:
    - amount
    - currency
    - customer_id
    - method
    - reference
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.PaymentResponse:
    description: Internal ledger payment with caller reference and locally issued
      receipt number once settled.
    properties:
      amount:
        type: number
      created_at:
        type: string
      currency:
        type: string
      customer_id:
        type: integer
      deleted_at:
        type: string
      description:
        type: string
      due_date:
        type: string
      failure_reason:
        type: string
      id:
        type: integer
      invoice_id:
        type: string
      is_active:
        type: boolean
      method:
        type: string
      method_display:
        type: string
      paid_at:
        type: string
      reason:
        type: string
      receipt_number:
        type: string
      reference:
        type: string
      refund_amount:
        type: number
      refunded_at:
        type: string
      status:
        type: string
      status_display:
        type: string
      updated_at:
        type: string
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.PaymentUpdateRequest:
    description: All fields optional; only provided fields are updated (amount, currency,
      method, description, due_date, invoice_id).
    properties:
      amount:
        type: number
      currency:
        type: string
      description:
        maxLength: 500
        type: string
      due_date:
        type: string
      invoice_id:
        type: string
      method:
        type: string
    type: object
  clinic-vet-api_internal_infrastructure_http_handlers_dtos.PetCreateRequest:
    description: Name, species, gender, optional breed/age/color/microchip/medical
      info, customer_id, optional emergency contact.
    properties:
      age:
        type: integer
      allergies:
        type: string
      behavioral_notes:
